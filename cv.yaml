  headline: Engineering Manager | Technical Product & Strategy | CISSP
  location: Lisbon, Portugal
  email: diogo.edgar.sousa@gmail.com
  social_networks:
    - network: LinkedIn
      username: 0xDSousa
    - network: GitHub
